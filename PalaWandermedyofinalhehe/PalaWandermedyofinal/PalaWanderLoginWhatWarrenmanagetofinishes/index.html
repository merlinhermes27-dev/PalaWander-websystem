<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalaWander | Welcome</title>
    <link rel="stylesheet" href="styles/style.css">
 </head>
 <body>
    
      <header class="navbar">
        <a href="#" class="logo">Pala<span>Wander<span></a>
        <p>Discover the beauty of Palawan???</p>
      </header>
       
         <main class="auth-container">
             <section class="welcome">
                 <p class="eyebrow">YOUR NEXT ADVENTURE</p>
                  <h1>Discover the wonders of Palawan.</h1>
                
             </section>
       
        <section class="auth-card">

            <div class="tabs">
                <button type="button" id="loginTab"
                   class="tab active">Login</button>      
              <button type="button" id="registerTab"
                    class="tab">Register</button>
            </div>
         
         <form id="loginForm">
                <h2>Welcome back!</h2>
                <p class="form-description">
                    Log in to continue your journey.
                </p>
          <label for="loginEmail">Email address</label>
                <input type="email" id="loginEmail"
                    placeholder="you@example.com" required>  
           
          <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
               placeholder="Enter your password"
                    minlength="8" required>         
           
            <button type="submit" class="primary-btn">Login</button>
            <p class="switch-text">
                Don't have an account?
                <button type="button"id="showRegister">Register</button>
             </p>
          </form>
         
          <form id="registerForm" hidden>
                <h2>Create an account</h2>
                <p class="form-description">
                    Start exploring Palawan with us.
               </p>
               
            <label for="fullName">Full name</label>
                <input type="text" id="fullName"
                  placeholder="Enter your full name"
                    autocomplete="name" required>
           
            <label for="registerEmail">Email address</label>
              <input type="email" id="registerEmail"
                    placeholder="you@example.com"
                    autocomplete="email" required>

             <label for="registerRole">I am a</label>
              <select id="registerRole" required>
                  <option value="user">Tourist (User)</option>
                  <option value="staff">Tourist Staff</option>
              </select>  
             
            <label for="registerPassword">Password</label>
              <input type="password" id="registerPassword"
              placeholder="At least 8 characters"
                   minlength="8"
               autocomplete="new-password" required> 
               
            <label for="confirmPassword">Confirm password</label>
               <input type="password" id="confirmPassword"
             placeholder="Enter your password again"
                    minlength="8"
               autocomplete="new-password" required>
              
          <button type="submit" class="primary-btn">
                 Create Account
                </button>

                <p class="switch-text">
                    Already have an account?
                    <button type="button" id="showLogin"> Login </button>
                </p>
            </form> 
           <p id="message" class="message"            
             role="status" aria-live="polite"></p>
       
        </section>
   
    </main>

    <footer>
        <p>&copy; 2026 PalaWander. All Rights Reserved.</p>
    </footer>
    
    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
 
      const firebaseConfig = {
        apiKey: "AIzaSyA1XJ8D4Re-MWwJcCL4BoeXw5K5-TIz3V4",
        authDomain: "palawander.firebaseapp.com",
        projectId: "palawander",
        storageBucket: "palawander.firebasestorage.app",
        messagingSenderId: "210829193423",
        appId: "1:210829193423:web:f170cac841e2cc57a587ba",
        measurementId: "G-D2XCS3H5MP"
      };
 
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
 
      // Ilagay sa window para magamit ng script.js (hindi module)
      window.firebaseAuth = auth;
      window.firebaseDb = db;
      window.firebaseCreateUser = createUserWithEmailAndPassword;
      window.firebaseSignIn = signInWithEmailAndPassword;
      window.firebaseDoc = doc;
      window.firebaseSetDoc = setDoc;
      window.firebaseGetDoc = getDoc;
 
      // I-signal na ready na ang Firebase, tapos i-load na ang script.js
      window.dispatchEvent(new Event("firebase-ready"));
    </script>
 
    <script src="script.js"></script>
</body>
</html>
